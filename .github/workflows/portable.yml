name: Windows portable
on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: node scripts/icon.mjs
      - run: npm run tauri build -- --no-bundle
      - name: Prepare executable
        run: Copy-Item src-tauri/target/release/pterohub.exe PteroHub-portable.exe
      - uses: actions/upload-artifact@v4
        with:
          name: PteroHub-Windows-portable
          path: PteroHub-portable.exe
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" PteroHub-portable.exe --generate-notes --verify-tag
